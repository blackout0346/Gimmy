services:
  # --- ИНФРАСТРУКТУРА ---
  postgres:
    image: postgres:18-alpine
    container_name: homeseller-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - homeseller-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: homeseller-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMQ__Username}
      RABBITMQ_DEFAULT_PASS: ${RabbitMQ__Password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - homeseller-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: homeseller-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${Redis__Password}
    ports:
      - "${Redis__Port:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - homeseller-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${Redis__Password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- БЭКЕНД-СЕРВИСЫ ---
  homeseller.authservice:
    image: homeseller.authservice
    build:
      context: .
      dockerfile: HomeSeller.AuthService/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - homeseller-net

  homeseller.cartservice:
    image: homeseller.cartservice
    build:
      context: .
      dockerfile: HomeSeller.CartService/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - homeseller-net

  homeseller.messenger:
    image: homeseller.messenger
    build:
      context: .
      dockerfile: HomeSeller.Messenger/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - homeseller-net

  homeseller.notification:
    image: homeseller.notification
    build:
      context: .
      dockerfile: HomeSeller.Notification/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      rabbitmq: { condition: service_healthy }
    networks:
      - homeseller-net

  homeseller.productservice:
    image: homeseller.productservice
    build:
      context: .
      dockerfile: HomeSeller.ProductService/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - product_images:/app/wwwroot
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - homeseller-net

  homeseller.profileservice:
    image: homeseller.profileservice
    build:
      context: .
      dockerfile: HomeSeller.ProfileService/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - homeseller-net

  # --- ФРОНТЕНД (Next.js) ---
  homeseller.frontend:
    image: homeseller.frontend
    build:
      context: ../frontend/homesellerweb
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - homeseller-net

  # --- ТОЧКА ВХОДА ПО IP (Reverse Proxy) ---
  nginx:
    image: nginx:alpine
    container_name: homeseller-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - homeseller.frontend
      - homeseller.authservice
      - homeseller.productservice
      - homeseller.cartservice
      - homeseller.profileservice
      - homeseller.messenger
      - homeseller.notification
    networks:
      - homeseller-net

networks:
  homeseller-net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  product_images: